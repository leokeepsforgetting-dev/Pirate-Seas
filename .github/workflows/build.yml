name: Build Pirate Seas

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Rebuild Pirate Seas project
        run: |
          cat tar_chunks/chunk_00.txt tar_chunks/chunk_01.txt tar_chunks/chunk_02.txt tar_chunks/chunk_03.txt > PirateSeas-project.tar.gz.b64
          base64 -d PirateSeas-project.tar.gz.b64 > PirateSeas-project.tar.gz
          mkdir build-src
          tar -xzf PirateSeas-project.tar.gz -C build-src
          cp -R overlay/. build-src/
          sed -i 's/mod_version=0.4.0/mod_version=0.4.1/' build-src/gradle.properties

      - name: Build Forge mod
        working-directory: build-src
        run: gradle --no-daemon clean build --stacktrace

      - name: Upload playable JAR
        uses: actions/upload-artifact@v4
        with:
          name: PirateSeas-Forge-1.20.1-v0.4.1
          path: build-src/build/libs/*.jar
          if-no-files-found: error
