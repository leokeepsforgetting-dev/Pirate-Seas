name: Build Pirate Seas

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q PirateSeas-v0.4.0-project.zip -d build-src

      - name: Build Forge mod
        working-directory: build-src
        run: gradle --no-daemon clean build --stacktrace

      - name: Upload playable JAR
        uses: actions/upload-artifact@v4
        with:
          name: PirateSeas-Forge-1.20.1
          path: build-src/build/libs/*.jar
          if-no-files-found: error
